  var QSFIELD=[
    // ClickFix
    {q:"A fake CAPTCHA page tells the user: press Win+R, then Ctrl+V, then Enter. What is this?",a:["ClickFix: the page put a malicious command in the clipboard and the user runs it himself","Clickjacking via an invisible iframe","A normal Cloudflare bot check","Drive-by download through a browser exploit"],why:"ClickFix is social engineering: the user runs the attacker’s command for him. No exploit and no attachment, so it bypasses email filters and lots of web controls.",tag:"Name the attack"},
    {q:"ClickFix suspected. Which registry key shows what the user typed into the Run dialog (Win+R)?",a:["HKCU\\...\\Explorer\\RunMRU","HKLM\\...\\CurrentVersion\\Run","HKLM\\SYSTEM\\CurrentControlSet\\Services","HKCU\\Software\\Classes"],why:"RunMRU keeps the last commands typed in Win+R, often a full powershell/mshta one-liner. The Run key (HKLM...\\Run) is about autostart persistence, not this.",tag:"Read the clue"},
    {q:"Which process tree fits ClickFix best?",a:["explorer.exe → powershell.exe / mshta.exe with a hidden window or a download command","winword.exe → cmd.exe","services.exe → svchost.exe","lsass.exe → rundll32.exe"],why:"Win+R commands start from explorer.exe. PowerShell -w hidden, iwr/iex or mshta with a URL straight from explorer is a strong signal (Event 4688 / Sysmon 1)."},
    {q:"Best preventive control against ClickFix for regular users?",a:["Awareness training plus blocking Win+R / PowerShell for non-admins (GPO, AppLocker, ASR)","Blocking port 443","Disabling CAPTCHAs on the proxy","Enabling SMB signing"],why:"The user is the delivery mechanism, so teach them that no real site asks you to paste commands, and limit what the Run dialog can launch."},
    // GCP
    {q:"In GCP, which logs record who changed what (create VM, change IAM, delete bucket)?",a:["Cloud Audit Logs – Admin Activity (always on, free)","VPC Flow Logs","Data Access logs (on by default for everything)","Windows Security log"],why:"Admin Activity logs are always on. Data Access logs (who read data) are mostly OFF by default and must be enabled, so a data theft may leave no trace if no one turned them on.",tag:"Precision"},
    {q:"GCP alert: SetIamPolicy added an external gmail.com account as Owner on a project. Severity?",a:["Critical: possible persistence/takeover. Check who made the change and revert","Low: owners are added all the time","Informational: IAM changes are normal","Medium: only affects billing"],why:"Owner = full control. Giving it to an outside account is a classic persistence move. Check the principal that made the call, it may be compromised.",tag:"Contain the right thing"},
    {q:"What is the most common way attackers get into GCP?",a:["Leaked service account keys (JSON key files) in code, repos or CI","Brute forcing the Google login page","Exploiting the hypervisor","Physical access to a Google data center"],why:"A downloaded SA key works from anywhere with no MFA. Prefer no keys at all (Workload Identity) and scan repos for secrets."},
    {q:"A Cloud Storage bucket has the member allUsers with a read role. What does that mean?",a:["Anyone on the internet can read it, without logging in","All employees in the org can read it","Only service accounts can read it","Nothing, allUsers means all admins"],why:"allUsers = public internet. allAuthenticatedUsers = any Google account in the world, not just your company. Both are a data-exposure finding."},
    {q:"What is Security Command Center in GCP?",a:["GCP’s built-in security dashboard: misconfigurations, threats and vulnerabilities","GCP’s firewall","A SIEM that replaces all other logs","The IAM admin console"],why:"SCC finds things like public buckets, open firewall rules and leaked keys, and its threat detection flags suspicious activity. Its findings usually get sent to the SIEM."},
    // NTLM
    {q:"How does NTLM authentication work?",a:["Challenge-response: the server sends a random challenge and the client answers with it encrypted using the password hash","The password is sent in Base64","A ticket from the KDC is shown to the server","A certificate is exchanged"],why:"The password never travels, but the hash is all you need to answer, which is why Pass-the-Hash works. Kerberos is the ticket-based one."},
    {q:"Responder answers LLMNR/NBT-NS requests on the LAN. What does the attacker get?",a:["NetNTLMv2 hashes of users who connect, to crack offline or relay","Kerberos golden tickets","Plaintext passwords from LSASS","The krbtgt hash"],why:"When DNS fails, Windows asks the LAN by broadcast and Responder answers “that’s me”. Defense: disable LLMNR and NBT-NS via GPO.",tag:"Name the attack"},
    {q:"What stops NTLM relay to SMB?",a:["SMB signing (required)","Blocking port 88","Longer passwords","RunAsPPL"],why:"With signing, a relayed session can’t be used because the attacker doesn’t have the session key. For LDAP: LDAP signing + channel binding. Long term: reduce NTLM and use Kerberos.",tag:"Precision"},
    {q:"Why do SOCs look for NTLM in an environment that should be using Kerberos?",a:["NTLM when Kerberos is expected (e.g. access by IP, not by name) can point to PtH or relay","NTLM is always malware","Kerberos logs nothing","NTLM is encrypted and Kerberos is not"],why:"Event 4624 shows the Authentication Package. A privileged account logging in with NTLM across many hosts is a classic lateral movement pattern.",tag:"Read the clue"},
    // Cobalt Strike
    {q:"What is Cobalt Strike?",a:["A commercial red-team C2 framework; cracked copies are widely used by real attackers and ransomware gangs","A Windows antivirus","A vulnerability scanner like Nessus","A password cracker"],why:"Its implant is called Beacon. Seeing Cobalt Strike usually means hands-on-keyboard and often comes before ransomware.",tag:"Name it"},
    {q:"Network pattern: a host connects to the same domain every 60s ± 10%, with small fixed-size responses. Most likely?",a:["C2 beaconing (e.g. Cobalt Strike sleep + jitter)","Windows Update","A normal browsing session","An NTP time sync"],why:"Sleep = how long Beacon waits, jitter = randomness so it looks less robotic. Regular intervals to a rare domain = beaconing.",tag:"Read the clue"},
    {q:"rundll32.exe running with NO arguments and making network connections. Why is that suspicious?",a:["Cobalt Strike’s default spawnto: it starts rundll32 empty and injects Beacon into it","rundll32 always runs like that","It means Windows Update is running","It’s a sign of a failed DLL install"],why:"Legit rundll32 always gets a DLL and a function as arguments. Empty rundll32 talking to the internet is a classic Cobalt Strike indicator."},
    {q:"What is a Cobalt Strike Malleable C2 profile?",a:["A config that disguises Beacon traffic to look like normal traffic (e.g. jQuery or Amazon requests)","An exploit kit","A list of targets","The license file"],why:"That’s why you can’t trust URLs or headers alone. Look at behavior: timing, JA3/JARM fingerprints, process tree, named pipes."},
    // Follina
    {q:"Follina (CVE-2022-30190) abuses which Windows component?",a:["MSDT – the Microsoft Support Diagnostic Tool, via the ms-msdt: URL","The Print Spooler","Netlogon","SMBv1"],why:"A Word doc loads a remote HTML page that calls ms-msdt:, and MSDT runs PowerShell. PrintNightmare = Spooler, Zerologon = Netlogon, EternalBlue = SMBv1.",tag:"Name it"},
    {q:"Why was Follina so dangerous compared to classic malicious Office docs?",a:["No macros needed: just opening the doc (or previewing an RTF) runs code","It needed admin rights","It only worked on Linux","It required the user to type a command"],why:"Macro blocking didn’t help. A zero-click-ish doc via the preview pane is a big jump from “enable content”."},
    {q:"Which process tree is the Follina signature?",a:["winword.exe → msdt.exe (→ sdiagnhost.exe → powershell/cmd)","explorer.exe → powershell.exe","lsass.exe → cmd.exe","svchost.exe → msiexec.exe"],why:"Office should never launch msdt.exe. A good generic rule: Office apps spawning any script engine or LOLBin is suspicious.",tag:"Read the clue"},
    {q:"Quick workaround for Follina before the patch existed?",a:["Delete the ms-msdt protocol handler from the registry (HKCR\\ms-msdt)","Block port 445","Disable Kerberos","Uninstall Word"],why:"Removing the URL handler breaks the chain. Then patch. ASR rule “block Office apps from creating child processes” also helps."},
    // Zerologon
    {q:"Zerologon (CVE-2020-1472) attacks what, and what does the attacker need?",a:["The Netlogon protocol on a Domain Controller; only network access to the DC, no credentials","LSASS on a workstation; local admin","Exchange; a mailbox","The web server; a valid session cookie"],why:"A crypto bug (AES-CFB8 with an all-zero IV) lets the attacker authenticate as the DC with a credential of zeros. About 1 in 256 tries works, so it takes seconds.",tag:"Name it"},
    {q:"After Zerologon, what does the attacker do with the DC?",a:["Sets the DC’s machine account password to empty, then runs DCSync to dump every hash, including krbtgt","Installs ransomware directly from Netlogon","Reads emails","Only crashes the DC"],why:"Full domain takeover in minutes. Bonus: the empty password breaks the DC’s own trust and can break AD replication, which is sometimes how people notice."},
    {q:"Which DC event is a strong Zerologon indicator?",a:["4742 (computer account changed) for the DC’s own account, done by ANONYMOUS LOGON","4624 type 2","4740 account lockout","1102 log cleared"],why:"A DC machine password reset by an anonymous user should never happen. Also: a burst of Netlogon traffic, and events 5827–5829 after patching.",tag:"Read the clue"},
    {q:"Zerologon fix?",a:["Patch the DCs (Aug 2020) and enforce secure RPC for Netlogon (enforcement mode, Feb 2021)","Disable NTLM on workstations","Block port 3389","Reset all user passwords"],why:"Patch first. If it was already exploited, assume full domain compromise: reset krbtgt twice and treat it as a major incident.",tag:"Contain first, harden later"}
  ];
  function pick(arr,idx){return idx.map(function(i){return arr[i]})}
  function rg(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r}
  var TOPICS=[
    {k:'ip',label:'IP + DHCP + subnets',list:pick(QS,rg(0,8).concat([17,18,20])).concat(pick(QSW,[12,13,14].concat(rg(16,27))))},
    {k:'arp',label:'ARP + spoofing',list:pick(QS,rg(9,16).concat([19])).concat(pick(QSW,rg(28,32)))},
    {k:'osi',label:'OSI + TCP/UDP',list:pick(QS2,rg(0,5).concat([9]))},
    {k:'aosi',label:'Attack → OSI layer',list:QSOSI},
    {k:'dns',label:'DNS',list:pick(QS2,[6,7,8]).concat(pick(QSW,rg(0,4).concat([33])),pick(QSCD,rg(3,6)))},
    {k:'cry',label:'Crypto + encoding',list:pick(QSCD,[0,1,2])},
    {k:'fw',label:'Firewalls, IDS, ports',list:pick(QS2,rg(10,21)).concat(QSFW,pick(QSW,[15,34,35]))},
    {k:'ad',label:'Active Directory + Kerberos',list:QS3.concat(QSAD,pick(QSW,[36,37,38]))},
    {k:'bf',label:'Brute force + DDoS',list:QSDD.concat(pick(QSW,[5,6,7]))},
    {k:'web',label:'Web + WAF',list:QSWEB},
    {k:'soc',label:'SOC core',list:QSSOC},
    {k:'ph',label:'Phishing',list:QSPH},
    {k:'ir',label:'IR + Kill Chain + MITRE',list:QSIR.concat(pick(QSW,[8,9,10,11]))},
    {k:'log',label:'Read the log',list:QSLOG},
    {k:'field',label:'From the Field',list:QSFIELD}
  ];
  var TKEY='socdrill-topics';
  var sel=(function(){try{var v=JSON.parse(localStorage.getItem(TKEY));if(v&&v.keys&&v.keys.length)return v}catch(e){}return {keys:['log'],weak:false}})();
  function saveSel(){try{localStorage.setItem(TKEY,JSON.stringify(sel))}catch(e){}}
  var topicsOpen=false;
  function selectedList(){
    var out=[];TOPICS.forEach(function(t){if(sel.keys.indexOf(t.k)>=0)out=out.concat(t.list)});
    if(sel.weak)out=out.filter(function(x){return !!x.tag});
    return out;
  }
  var cs={deck:shuffle(selectedList()),i:0,missed:[],right:0};

  function startDeck(list){cs={deck:shuffle(list),i:0,missed:[],right:0};topicsOpen=false;renderConcepts()}
  function deckBar(){
    var n=selectedList().length;
    var names=TOPICS.filter(function(t){return sel.keys.indexOf(t.k)>=0}).map(function(t){return t.label});
    var sum=(names.length===TOPICS.length?'All topics':names.length===1?names[0]:names.length+' topics')+(sel.weak?' · weak patterns':'')+' · '+n+' Q';
    return '<details class="topicbox"'+(topicsOpen?' open':'')+'><summary>Topics: '+esc(sum)+'</summary>'+
      '<div class="decks" role="group" aria-label="Topics">'+TOPICS.map(function(t){return '<button class="chip" data-t="'+t.k+'" aria-pressed="'+(sel.keys.indexOf(t.k)>=0)+'">'+esc(t.label)+' <span>'+t.list.length+'</span></button>'}).join('')+'</div>'+
      '<div class="trow"><button class="mini" id="tAll">Select all</button><button class="mini" id="tNone">Clear</button>'+
      '<button class="chip weakchip" id="tWeak" aria-pressed="'+sel.weak+'">Only my weak patterns</button></div>'+
      '<button class="primary" id="tGo"'+(n?'':' disabled')+'>'+(n?'Start quiz · '+n+' questions':'Pick at least one topic')+'</button></details>';
  }
  function wireDecks(){
    var box=view.querySelector('.topicbox'); if(!box)return;
    box.addEventListener('toggle',function(){topicsOpen=box.open});
    function refresh(){saveSel();topicsOpen=true;var old=view.querySelector('.topicbox');var tmp=document.createElement('div');tmp.innerHTML=deckBar();old.replaceWith(tmp.firstChild);wireDecks()}
    box.querySelectorAll('.chip[data-t]').forEach(function(b){b.onclick=function(){
      var k=b.dataset.t,i=sel.keys.indexOf(k); if(i>=0)sel.keys.splice(i,1); else sel.keys.push(k); refresh()}});
    document.getElementById('tAll').onclick=function(){sel.keys=TOPICS.map(function(t){return t.k});refresh()};
    document.getElementById('tNone').onclick=function(){sel.keys=[];refresh()};
    document.getElementById('tWeak').onclick=function(){sel.weak=!sel.weak;refresh()};
    document.getElementById('tGo').onclick=function(){saveSel();startDeck(selectedList())};
  }

  function renderConcepts(){
    if(cs.i>=cs.deck.length){
      var n=cs.deck.length;
      view.innerHTML='<div class="done"><p class="progress">Round finished</p><p class="big">'+cs.right+'/'+n+'</p><p class="hint">'+(cs.missed.length?'You missed '+cs.missed.length+'. Run them again until they stick.':'Clean sweep. Try the subnet drill next.')+'</p></div>'+
        (cs.missed.length?'<button class="primary" id="redo">Review the ones I missed</button>':'')+
        '<button class="'+(cs.missed.length?'secondary':'primary')+'" id="again">Start a new round</button>';
      view.innerHTML=deckBar()+view.innerHTML; wireDecks();
      var r=document.getElementById('redo'); if(r) r.onclick=function(){startDeck(cs.missed)};
      document.getElementById('again').onclick=function(){startDeck(selectedList())};
      return;
    }
    var item=cs.deck[cs.i];
    var opts=shuffle(item.a.map(function(t,k){return {t:t,ok:k===0}}));
    view.innerHTML=deckBar()+'<p class="progress">Question '+(cs.i+1)+' of '+cs.deck.length+(item.tag?' <span class="tag">'+esc(item.tag)+'</span>':'')+'</p><h2 class="q">'+esc(item.q)+'</h2><div class="opts">'+
      opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>'}).join('')+'</div><div id="after"></div>';
    wireDecks();
    var btns=view.querySelectorAll('.opt');
    btns.forEach(function(b){b.onclick=function(){
      var k=+b.dataset.k, ok=opts[k].ok;
      btns.forEach(function(x,j){x.disabled=true; if(opts[j].ok) x.classList.add('right')});
      if(!ok){b.classList.add('wrong'); cs.missed.push(item)} else cs.right++;
      record(ok);
      document.getElementById('after').innerHTML='<div class="why"><p><strong>'+(ok?'Correct.':'Not quite.')+'</strong> '+esc(item.why)+'</p>'+(item.more?'<p>'+esc(item.more)+'</p>':'')+'</div><button class="primary" id="next">Next question</button>';
      var nx=document.getElementById('next'); nx.focus(); nx.onclick=function(){cs.i++;renderConcepts()};
    }});
  }

  /* ---------------- Subnets ---------------- */
  function genSubnet(){
    var bases=[[10,rnd(256),rnd(256)],[172,16+rnd(16),rnd(256)],[192,168,rnd(256)]];
    var base=bases[rnd(3)];
    var ps=[24,25,26,26,27,27,28,28,29,30];
    var p=ps[rnd(ps.length)], b=Math.pow(2,32-p);
    var h=rnd(256), net=Math.floor(h/b)*b, bc=net+b-1;
    if(h===net||h===bc) h=net+1+rnd(b-2);
    return {pre:base.join('.')+'.',p:p,b:b,h:h,net:net,bc:bc,first:net+1,last:bc-1,hosts:b-2};
  }
  var sq=genSubnet();

  function num(v){v=String(v).trim(); if(!v) return NaN; return parseInt(v.split('.').pop().replace('/',''),10)}

  function fieldHTML(id,label,pre){
    return '<div class="field"><label for="'+id+'">'+label+'</label><div class="inbox" id="box-'+id+'">'+(pre?'<span class="pre mono">'+esc(pre)+'</span>':'')+
      '<input id="'+id+'" inputmode="numeric" autocomplete="off" enterkeyhint="next"></div></div>';
  }

  function renderSubnets(){
    var s=sq;
    view.innerHTML='<p class="progress">Find all four answers</p><p class="prompt mono">'+s.pre+s.h+'/'+s.p+'</p><p class="hint">Block size, count, locate, read.</p>'+
      fieldHTML('f-net','Network ID',s.pre)+fieldHTML('f-bc','Broadcast',s.pre)+fieldHTML('f-first','First usable',s.pre)+fieldHTML('f-last','Last usable',s.pre)+fieldHTML('f-hosts','Usable hosts','')+
      '<button class="primary" id="check">Check my answers</button><div id="after"></div>'+TABLE;
    wireEnter(['f-net','f-bc','f-first','f-last','f-hosts']);
    document.getElementById('check').onclick=checkSubnet;
  }

  function wireEnter(ids){
    ids.forEach(function(id,k){document.getElementById(id).addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault(); if(k<ids.length-1) document.getElementById(ids[k+1]).focus(); else document.getElementById('check').click()}
    })});
  }

  function mark(id,ok,fix){
    var box=document.getElementById('box-'+id); box.classList.remove('right','wrong'); box.classList.add(ok?'right':'wrong');
    box.querySelector('input').readOnly=true;
    if(!ok){var d=document.createElement('div'); d.className='fix'; d.textContent='Answer: '+fix; box.parentNode.appendChild(d)}
  }

  function checkSubnet(){
    var s=sq, all=true;
    [['f-net',s.net,s.pre+s.net],['f-bc',s.bc,s.pre+s.bc],['f-first',s.first,s.pre+s.first],['f-last',s.last,s.pre+s.last],['f-hosts',s.hosts,String(s.hosts)]].forEach(function(f){
      var ok=num(document.getElementById(f[0]).value)===f[1]; if(!ok) all=false; mark(f[0],ok,f[2]);
    });
    record(all);
    var starts=[]; for(var x=s.net-2*s.b;x<=s.net+2*s.b;x+=s.b){ if(x>=0&&x<=256) starts.push(x===s.net?'<strong>'+x+'</strong>':x) }
    var cells='';
    for(var i=0;i<256;i++){
      var c='cell'; if(Math.floor(i/s.b)%2) c+=' alt';
      if(i>=s.net&&i<=s.bc) c+=' in';
      if(i===s.net) c+=' net'; if(i===s.bc) c+=' bc'; if(i===s.h) c+=' me';
      cells+='<div class="'+c+'"></div>';
    }
    document.getElementById('check').remove();
    document.getElementById('after').innerHTML=
      '<div class="why"><p><strong>'+(all?'All correct.':'Check the red fields.')+'</strong></p></div>'+
      '<ol class="steps"><li><span class="mono">/'+s.p+'</span> means blocks of <strong>'+s.b+'</strong>.</li>'+
      '<li>Count in '+s.b+'s: '+starts.join(', ')+'.</li>'+
      '<li>House '+s.h+' sits in the <span class="mono">'+s.net+'\u2013'+s.bc+'</span> neighborhood.</li>'+
      '<li>First = network <span class="mono">.'+s.net+'</span>, last = broadcast <span class="mono">.'+s.bc+'</span>, usable <span class="mono">.'+s.first+'\u2013.'+s.last+'</span>, '+s.b+' \u2212 2 = '+s.hosts+' hosts.</li></ol>'+
      '<div class="street"><h3>The street, 0 to 255</h3><p class="cap">Each square is one address in the last octet. Shading alternates per neighborhood.</p><div class="grid" aria-hidden="true">'+cells+'</div>'+
      '<div class="legend"><span><i style="background:var(--in)"></i>Your neighborhood</span><span><i style="background:var(--mark)"></i>Network ID and broadcast</span><span><i style="background:var(--block-a);box-shadow:0 0 0 2px var(--bad)"></i>Your host</span></div></div>'+
      '<button class="primary" id="next">Next address</button>';
    var nx=document.getElementById('next'); nx.onclick=function(){sq=genSubnet();renderSubnets(); document.getElementById('f-net').focus()};
  }

  /* ---------------- Masks ---------------- */
  function genMask(){
    var t=rnd(3), p=25+rnd(6);
    if(Math.random()<.15) p=24;
    if(t===2){var n=3+rnd(250); var q=30; while(Math.pow(2,32-q)-2<n) q--; return {t:2,n:n,p:q}}
    return {t:t,p:p};
  }
  var mq=genMask();

  function renderMasks(){
    var m=mq, h='';
    if(m.t===0){
      h='<p class="progress">Mask to CIDR</p><p class="prompt mono">255.255.255.'+MASK[m.p]+'</p><p class="hint">What prefix is this, and how many usable hosts?</p>'+
        fieldHTML('m-a','CIDR','/')+fieldHTML('m-b','Usable hosts','');
    } else if(m.t===1){
      h='<p class="progress">CIDR to mask</p><p class="prompt mono">/'+m.p+'</p><p class="hint">Write the mask and the usable hosts.</p>'+
        fieldHTML('m-a','Mask','255.255.255.')+fieldHTML('m-b','Usable hosts','');
    } else {
      h='<p class="progress">Size it</p><p class="prompt">'+m.n+' hosts</p><p class="hint">What\u2019s the smallest subnet that fits them?</p>'+
        fieldHTML('m-a','CIDR','/');
    }
    view.innerHTML=h+'<button class="primary" id="check">Check my answers</button><div id="after"></div>'+TABLE;
    var ids=m.t===2?['m-a']:['m-a','m-b'];
    wireEnter(ids);
    document.getElementById('check').onclick=checkMask;
  }

  function checkMask(){
    var m=mq, b=Math.pow(2,32-m.p), all=true, exp;
    if(m.t===0){
      var a=num(document.getElementById('m-a').value)===m.p, c=num(document.getElementById('m-b').value)===b-2;
      mark('m-a',a,'/'+m.p); mark('m-b',c,String(b-2)); all=a&&c;
      exp='Last octet '+MASK[m.p]+' is the /'+m.p+' row. The three 255s are 24 bits, and '+MASK[m.p]+' adds '+(m.p-24)+' more. Block '+b+', so '+(b-2)+' usable.';
    } else if(m.t===1){
      var a1=num(document.getElementById('m-a').value)===MASK[m.p], c1=num(document.getElementById('m-b').value)===b-2;
      mark('m-a',a1,'255.255.255.'+MASK[m.p]); mark('m-b',c1,String(b-2)); all=a1&&c1;
      exp='/'+m.p+' gives blocks of '+b+'. Mask last octet = 256 \u2212 '+b+' = '+MASK[m.p]+'. Usable = '+b+' \u2212 2 = '+(b-2)+'.';
    } else {
      all=num(document.getElementById('m-a').value)===m.p; mark('m-a',all,'/'+m.p);
      var smaller=m.p<30?' A /'+(m.p+1)+' only fits '+(b/2-2)+'.':'';
      exp='/'+m.p+' gives '+(b-2)+' usable hosts, which fits '+m.n+'.'+smaller;
    }
    record(all);
    document.getElementById('check').remove();
    document.getElementById('after').innerHTML='<div class="why"><p><strong>'+(all?'Correct.':'Not quite.')+'</strong> '+exp+'</p></div><button class="primary" id="next">Next question</button>';
    var nx=document.getElementById('next'); nx.focus(); nx.onclick=function(){mq=genMask();renderMasks(); document.getElementById('m-a').focus()};
  }


  /* ---------------- Ports ---------------- */
  var PORTS=[['20/21','FTP'],['22','SSH'],['23','Telnet'],['25','SMTP'],['53','DNS'],['67/68','DHCP'],['80','HTTP'],['88','Kerberos'],['110','POP3'],['143','IMAP'],['389','LDAP'],['636','LDAPS'],['443','HTTPS'],['445','SMB'],['3389','RDP']];
  var PNOTE={'Telnet':'Cleartext, so credentials can be sniffed.','DNS':'UDP normally, TCP for big replies and zone transfers.','DHCP':'UDP, server 67 and client 68.','Kerberos':'Active Directory authentication. Tomorrow\u2019s topic.','SMB':'File sharing, and a classic lateral movement path (WannaCry).','RDP':'Remote desktop. Never expose it to the internet.','LDAPS':'LDAP over TLS.','FTP':'Cleartext. 21 control, 20 data.'};
  function genPort(){var i=rnd(PORTS.length),dir=rnd(2),wrong=shuffle(PORTS.filter(function(x,j){return j!==i})).slice(0,3);return {p:PORTS[i],dir:dir,wrong:wrong}}
  var pq=genPort();
  function renderPorts(){
    var m=pq, ask=m.dir?m.p[1]:m.p[0], col=m.dir?0:1;
    var opts=shuffle([{t:m.p[col],ok:true}].concat(m.wrong.map(function(w){return {t:w[col],ok:false}})));
    view.innerHTML='<p class="progress">'+(m.dir?'Which port?':'Which service?')+'</p><p class="prompt'+(m.dir?'':' mono')+'">'+esc(ask)+'</p><div class="opts">'+
      opts.map(function(o,k){return '<button class="opt'+(m.dir?' mono':'')+'" data-k="'+k+'">'+esc(o.t)+'</button>'}).join('')+'</div><div id="after"></div>';
    var btns=view.querySelectorAll('.opt');
    btns.forEach(function(b){b.onclick=function(){
      var ok=opts[+b.dataset.k].ok;
      btns.forEach(function(x,j){x.disabled=true; if(opts[j].ok) x.classList.add('right')});
      if(!ok) b.classList.add('wrong');
      record(ok);
      var note=PNOTE[m.p[1]];
      document.getElementById('after').innerHTML='<div class="why"><p><strong>'+(ok?'Correct.':'Not quite.')+'</strong> '+esc(m.p[1])+' is port '+esc(m.p[0])+'.'+(note?' '+esc(note):'')+'</p></div><button class="primary" id="next">Next port</button>';
      var nx=document.getElementById('next'); nx.focus(); nx.onclick=function(){pq=genPort();renderPorts()};
    }});
  }

  /* ---------------- Tabs ---------------- */
  function render(){ paintScore(); if(mode==='concepts') renderConcepts(); else if(mode==='subnets') renderSubnets(); else if(mode==='ports') renderPorts(); else renderMasks(); }
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){
    mode=b.dataset.mode;
    document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});
    render();
  }});
  document.getElementById('reset').onclick=function(){ if(confirm('Reset all your scores?')){stats=fresh();save();paintScore()} };
  render();
})();
</script>
